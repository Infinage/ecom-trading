{{define "Login"}}
<main class="flex flex-col flex-1">
  <form class="my-2 mx-16 flex flex-col gap-2" data-signals:login.error="''">
    <div class="flex flex-col py-2 gap-1">
      <label for="email">Email Address:</label>
      <input name="email" type="email" required
        class="p-2 border border-gray-400/50 rounded-md focus:outline-none 
          focus:ring-blue-200 focus:ring-4"
      />
      <span class="text-gray-600/80 text-sm">
        We'll never share your email with anyone else.
      </span>
    </div> 

    <div class="flex flex-col py-2 gap-1">
      <label for="password">Password:</label>
      <input name="password" type="password" required
        class="p-2 border border-gray-400/50 rounded-md focus:outline-none 
          focus:ring-blue-200 focus:ring-4"
      />
    </div> 

    <!-- Error messages -->
    <span data-show="$login.error !== ''"
      data-text="$login.error"
      class="text-red-600 font-medium"
    ></span>

    <div class="flex text-gray-50 gap-2 py-2">
      <button
        data-on:click="@post('/api/login', {contentType: 'form'})"
        class="bg-blue-600/80 rounded-md p-2 hover:bg-blue-600 cursor-pointer" 
      >Login</button>
      <a class="bg-zinc-800 rounded-md p-2 hover:bg-zinc-700 cursor-pointer"
        href="/register">New User Register here</a>
    </div>
  </form>
</main>
{{end}}
