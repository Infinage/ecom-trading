{{define "EditProduct"}}
<main class="flex flex-col flex-1" id="main">
  <div class="bg-zinc-800 w-full flex flex-col text-white px-8 py-4">
    <h2 class="uppercase text-6xl">Sell your product</h2>
    <h3 class="uppercase text-3xl">Add new product</h3>
    <div class="w-1/3"><img class="w-full h-auto" 
      src="/assets/images/new-product.svg" /></div>
  </div>

  <form 
    class="flex gap-12 my-4 mx-36" 
    data-on:submit="@put('/api/product', {contentType: 'form'})"
  >
    <!-- Input fields -->
    <div class="flex-1 flex flex-col gap-2">
      <input name="id" hidden value="{{if not .New}}{{.Product.ID}}{{else}}0{{end}}" />

      <div class="flex flex-col">
        <label class="text-gray-800" for="title">Product Name:</label>
        <input name="title" placeholder="Enter Product Name" autocapitalize="on" 
          {{if not .New}} value="{{.Product.Title}}" {{end}}
          autocomplete="off" required class="
            p-2 border border-gray-400/50 rounded-md focus:outline-none focus:ring-blue-200
            focus:ring-4"
        />
      </div>

      <div class="flex flex-col">
        <label class="text-gray-800" for="category">Category:</label>
        <select name="category" required 
          class="p-2 border border-gray-400/50 rounded-md focus:outline-none 
            focus:ring-blue-200 focus:ring-4"
        >
          <option value="" disabled {{if .New}}selected{{end}}>-- Select Category --</option>
          {{range .Categories}}
            <option 
              {{if and (not $.New) (eq . $.Product.Category)}} 
                selected 
              {{end}}
            >{{.}}</option>
          {{end}}
        </select>
      </div>

      <div class="flex flex-col">
        <label class="text-gray-800" for="stockcount">Stock Count:</label>
        <input name="stockcount" placeholder="Enter Stock Count" required
          {{if not .New}} value="{{.Product.StockCount}}" {{end}}
          type="number" min="0" class="p-2 border border-gray-400/50 rounded-md 
            focus:outline-none focus:ring-blue-200 focus:ring-4"
        />
      </div>

      <div class="flex flex-col">
        <label class="text-gray-800" for="price">Product Price:</label>
        <input name="price" placeholder="Enter Product Price" required
          {{if not .New}} value="{{.Product.Price}}" {{end}}
          type="number" min="0.001" step="0.001" class="p-2 border border-gray-400/50 
            rounded-md focus:outline-none focus:ring-blue-200 focus:ring-4"
        />
      </div>

      <div class="flex flex-col">
        <label class="text-gray-800" for="image">Image URL:</label>
        <input name="image" placeholder="Enter Image URL"
          {{if not .New}} value="{{.Product.Image}}" {{end}}
          data-on:input__debounce.500ms="
            if (el.value) $_product.image.src=el.value
            else $_product.image.src='/assets/images/default.svg'
          "
          type="url" class="p-2 border border-gray-400/50 rounded-md 
            focus:outline-none focus:ring-blue-200 focus:ring-4"
        />
      </div>

      <div class="flex flex-col">
        <label class="text-gray-800" for="image">Product Description:</label>
        <textarea name="description" placeholder="Enter Product Description" 
          rows="3" class="p-2 border border-gray-400/50 rounded-md focus:outline-none 
            focus:ring-blue-200 focus:ring-4"
        >{{if not .New}}{{.Product.Description}}{{end}}</textarea>
      </div>

      <!-- Display any errors with product update -->
      <span class="text-red-600" data-show="$_product.errors !== ''" 
        data-text="$_product.errors"></span>

      <button class="w-20 h-10 px-2 py-1 rounded-md bg-zinc-800 text-white 
        cursor-pointer hover:bg-zinc-800/80 mt-2">Submit</button>
    </div>

    <!-- Image preview -->
    <div class="flex w-fit items-center justify-center">
      <div class="h-[30rem]">
        <img 
          src="{{if not .New}}{{.Product.Image}}{{else}}/assets/images/default.svg{{end}}" 
          class="rounded-md border-gray-200 border h-full object-contain" 
          data-ref:_product.image 
        />
      </div>
    </div>
  </form>
</main>
{{end}}
