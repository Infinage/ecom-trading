<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/index.css">
  <script src="/assets/js/datastar.js" type="module" defer></script>
</head>
<body class="flex flex-col h-screen"
  {{if .Meta}}
  data-signals="{
    user: {
      name: '{{.Meta.Name}}', 
      id: {{.Meta.ID}}, 
      offering: {{.Meta.Offering}}, 
      cart: {{.Meta.Cart}},
    }
  }"
  {{else}}
    data-signals="{user: {name: '', id: 0, offering: 0, cart: 0}}"
  {{end}}
>
  {{template "Header" .}}
  {{.Content}}
  {{template "Footer" .}}
</body>
</html>
