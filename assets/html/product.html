{{define "ProductPage"}}
<main class="flex flex-col flex-1" id="main">
  <div class="flex mx-16 my-8">
    <!-- Product Image -->
    <div class="flex flex-1 justify-center">
      <img alt="{{.Product.Title}}" class="max-h-[500px]" src="{{.Product.Image}}" />
    </div>

    <!-- Product details -->
    <div class="flex flex-1 flex-col gap-4">
      <div class="flex gap-2 font-medium text-gray-600/80 text-2xl uppercase">
        <span>{{.Product.Category}}</span>
        <span>|</span>
        <span>Merchant#: {{.Product.SellerID}}</span>
      </div>

      <span class="text-5xl font-light [word-spacing:12px]">{{.Product.Title}}</span>
      <span class="text-gray-600/80 text-xl">{{.Product.StockCount}} left in stock</span>
      <span class="font-bold text-4xl my-2">$ {{.Product.Price}}</span>
      <span class="text-gray-800/80 text-xl line-clamp-6">{{.Product.Description}}</span>

      <div class="flex gap-2 mt-auto mb-8">
        <button 
          data-attr="{
            disabled: '{{.Product.SellerID}}' == $user.id,
            title: '{{.Product.SellerID}}' == $user.id? 'You are selling this': 'Add item to cart',
          }"
          class="
            w-32 border border-gray-400 rounded-md cursor-pointer
            hover:bg-zinc-800 hover:text-white disabled:cursor-not-allowed 
            disabled:hover:bg-transparent disabled:hover:text-inherit
          "
        >Add to Cart</button>
        <button class="w-28 h-10 px-2 py-1 rounded-md bg-zinc-800 text-white 
          cursor-pointer hover:bg-zinc-800/80">Go to Cart</button>
      </div>
    </div>
  </div>

  <!-- Recommended products -->
  <div class="flex flex-col  mx-16 my-8 gap-4">
    <span class="text-lg italic text-gray-600">Similar Suggestions</span>
    <div class="flex gap-4">
      {{range .Samples}}
        <div class="flex flex-col h-[25rem] w-[15rem] border border-gray-400/80 p-2 gap-4">
          <img src="{{.Image}}" class="w-[8rem] h-[10rem] m-auto" />
          <span class="h-[5rem] text-lg line-clamp-3">{{.Title}}</span>
          <span class="text-gray-600">${{.Price}}</span>
          <a href="/product/{{.ID}}" 
            class="w-full px-2 py-1 rounded-md bg-zinc-800 text-white 
            cursor-pointer hover:bg-zinc-800/80 text-center"
          >View Product</a>
        </div>
      {{end}}
    </div>
  </div>
</main>
{{end}}
